<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let's learning English ✨</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Marker Felt",
                   "Comic Neue", -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    body {
      background: linear-gradient(160deg, #FFF0F5 0%, #FFE4F1 40%, #F5E6FF 100%);
      color: #3D3D5C;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Floating bubble decorations */
    .bubbles span {
      position: absolute;
      border-radius: 50%;
      opacity: 0.55;
      animation: floaty 8s ease-in-out infinite;
      pointer-events: none;
    }
    .bubbles span:nth-child(1) { width: 60px; height: 60px; background: #FFB3D9; top: 8%;  left: 6%;  animation-delay: 0s; }
    .bubbles span:nth-child(2) { width: 40px; height: 40px; background: #FFE08A; top: 70%; left: 12%; animation-delay: 1.2s; }
    .bubbles span:nth-child(3) { width: 80px; height: 80px; background: #A8E6CF; top: 15%; right: 8%; animation-delay: 2.4s; }
    .bubbles span:nth-child(4) { width: 50px; height: 50px; background: #B5D8FF; top: 55%; right: 10%; animation-delay: 3.6s; }
    .bubbles span:nth-child(5) { width: 30px; height: 30px; background: #D4B8FF; top: 85%; left: 50%; animation-delay: 4.8s; }
    .bubbles span:nth-child(6) { width: 45px; height: 45px; background: #FFB3D9; top: 35%; left: 45%; animation-delay: 6s; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-20px) scale(1.05); }
    }

    /* Screen container */
    .screen {
      position: absolute; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2;
    }
    .screen.active { display: flex; animation: popIn 0.5s ease-out; }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Home screen */
    .home-title {
      font-size: clamp(2rem, 6vw, 3.8rem);
      color: #FF6B9D;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 10px;
      text-shadow: 3px 3px 0 #fff, 6px 6px 0 #FFD1E6;
    }
    .home-sub {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: #9B6AA8;
      margin-bottom: 32px;
    }
    .start-btn {
      font-family: inherit;
      font-size: clamp(1.2rem, 3.5vw, 1.6rem);
      font-weight: bold;
      padding: 18px 56px;
      background: linear-gradient(145deg, #FF8DB8, #FF6B9D);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #E85589, 0 10px 20px rgba(255,107,157,0.35);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #E85589, 0 14px 24px rgba(255,107,157,0.4); }
    .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #E85589, 0 4px 10px rgba(255,107,157,0.3); }

    /* Question screen */
    .q-counter {
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      color: #9B6AA8;
      margin-bottom: 8px;
      background: #fff;
      padding: 6px 20px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #E9D6F2;
    }
    .q-prompt {
      font-size: clamp(1.3rem, 3.5vw, 1.8rem);
      color: #5A3D7A;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .q-image {
      width: min(260px, 60vw);
      height: min(260px, 60vw);
      object-fit: cover;
      border-radius: 28px;
      background: #fff;
      border: 5px solid #fff;
      box-shadow: 0 10px 0 #FFD1E6, 0 18px 36px rgba(255,107,157,0.25);
      margin-bottom: 28px;
    }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: min(420px, 92vw);
    }
    .opt-btn {
      font-family: inherit;
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      font-weight: bold;
      padding: 16px 10px;
      border: none;
      border-radius: 22px;
      background: linear-gradient(145deg, #FFF5CC, #FFE68A);
      color: #7A5A00;
      cursor: pointer;
      box-shadow: 0 4px 0 #E6C235;
      transition: transform 0.1s, box-shadow 0.1s, background 0.2s, color 0.2s;
      position: relative;
      min-height: 56px;
    }
    .opt-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .opt-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #E6C235; }

    .opt-btn.wrong {
      background: linear-gradient(145deg, #FFC4C4, #FF8A8A) !important;
      color: #7A1A1A !important;
      box-shadow: 0 4px 0 #D94848 !important;
      cursor: not-allowed;
    }
    .opt-btn.wrong::after {
      content: "✗";
      position: absolute;
      right: 12px;
      top: 50%; transform: translateY(-50%);
      font-size: 1.3em;
      color: #C02020;
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%,100% { transform: translateY(-50%) translateX(0); }
      25% { transform: translateY(-50%) translateX(-6px); }
      75% { transform: translateY(-50%) translateX(6px); }
    }
    .opt-btn.correct {
      background: linear-gradient(145deg, #B8F0D0, #6AD99B) !important;
      color: #1A5A3A !important;
      box-shadow: 0 4px 0 #3BA86A !important;
      cursor: default;
      animation: correctPop 0.5s ease-out;
    }
    .opt-btn.correct::after {
      content: "✓";
      position: absolute;
      right: 12px;
      top: 50%; transform: translateY(-50%);
      font-size: 1.3em;
      color: #1A7A3A;
    }
    @keyframes correctPop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* Victory screen */
    .victory-title {
      font-size: clamp(2rem, 6vw, 4rem);
      color: #FF6B9D;
      text-align: center;
      text-shadow: 3px 3px 0 #fff, 6px 6px 0 #FFD1E6;
      margin-bottom: 12px;
      animation: wiggle 1s ease-in-out infinite;
    }
    @keyframes wiggle {
      0%,100% { transform: rotate(-2deg); }
      50%     { transform: rotate(2deg); }
    }
    .victory-sub {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: #7A5A9A;
      margin-bottom: 28px;
      text-align: center;
    }
    .stars {
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 10px;
      margin-bottom: 28px;
      animation: sparkle 1.2s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%,100% { opacity: 1; transform: scale(1); }
      50%     { opacity: 0.7; transform: scale(1.1); }
    }
    .replay-btn {
      font-family: inherit;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: bold;
      padding: 14px 44px;
      background: linear-gradient(145deg, #A8E6CF, #6AD99B);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #3BA86A;
    }
    .replay-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #3BA86A; }

    @media (max-width: 400px) {
      .options { gap: 10px; }
      .opt-btn { padding: 14px 8px; min-height: 52px; }
    }
  </style>
</head>
<body>
  <div class="bubbles"><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <!-- HOME -->
  <section class="screen active" data-screen="home">
    <h1 class="home-title">Let's learning English</h1>
    <p class="home-sub">🌟 Tap Start to play! 🌟</p>
    <button class="start-btn" onclick="Game.start()">▶ Start</button>
  </section>

  <!-- QUESTION 1 -->
  <section class="screen" data-screen="q1">
    <div class="q-counter">Question 1 / 3</div>
    <div class="q-prompt">What is this? 🍎</div>
    <img class="q-image" src="1.jpg" alt="Question 1" />
    <div class="options">
      <button class="opt-btn" data-answer="apple">apple</button>
      <button class="opt-btn" data-answer="banana">banana</button>
      <button class="opt-btn" data-answer="pear">pear</button>
      <button class="opt-btn" data-answer="grape">grape</button>
    </div>
  </section>

  <!-- QUESTION 2 -->
  <section class="screen" data-screen="q2">
    <div class="q-counter">Question 2 / 3</div>
    <div class="q-prompt">What is this? 🐶</div>
    <img class="q-image" src="2.jpg" alt="Question 2" />
    <div class="options">
      <button class="opt-btn" data-answer="cat">cat</button>
      <button class="opt-btn" data-answer="dog">dog</button>
      <button class="opt-btn" data-answer="mouse">mouse</button>
      <button class="opt-btn" data-answer="bird">bird</button>
    </div>
  </section>

  <!-- QUESTION 3 -->
  <section class="screen" data-screen="q3">
    <div class="q-counter">Question 3 / 3</div>
    <div class="q-prompt">What is this? 👁️</div>
    <img class="q-image" src="3.jpg" alt="Question 3" />
    <div class="options">
      <button class="opt-btn" data-answer="hand">hand</button>
      <button class="opt-btn" data-answer="foot">foot</button>
      <button class="opt-btn" data-answer="eye">eye</button>
      <button class="opt-btn" data-answer="nose">nose</button>
    </div>
  </section>

  <!-- VICTORY -->
  <section class="screen" data-screen="victory">
    <h1 class="victory-title">You did it! 🎉</h1>
    <div class="stars">⭐ ⭐ ⭐</div>
    <p class="victory-sub">Great job! You know all the words! 💖</p>
    <button class="replay-btn" onclick="Game.restart()">🔄 Play Again</button>
  </section>

<script>
  const Game = {
    currentQ: 0,
    questions: [
      { name: "q1", correct: "apple" },
      { name: "q2", correct: "dog"   },
      { name: "q3", correct: "eye"   },
    ],

    show(name) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      const target = document.querySelector(`[data-screen="${name}"]`);
      if (target) target.classList.add("active");
    },

    start() {
      this.currentQ = 0;
      this.bindQuestion("q1");
      this.show("q1");
    },

    bindQuestion(name) {
      const screen = document.querySelector(`[data-screen="${name}"]`);
      const q = this.questions.find(q => q.name === name);
      const buttons = screen.querySelectorAll(".opt-btn");
      buttons.forEach(b => {
        b.classList.remove("wrong", "correct");
        b.disabled = false;
        b.onclick = () => this.handleAnswer(b, q.correct, buttons);
      });
    },

    handleAnswer(btn, correctAnswer, buttons) {
      if (btn.dataset.answer === correctAnswer) {
        btn.classList.add("correct");
        btn.disabled = true;
        buttons.forEach(b => { if (b !== btn) b.disabled = true; });
        // advance after a short celebration
        setTimeout(() => {
          this.currentQ++;
          if (this.currentQ < this.questions.length) {
            const next = this.questions[this.currentQ].name;
            this.bindQuestion(next);
            this.show(next);
          } else {
            this.show("victory");
          }
        }, 900);
      } else {
        btn.classList.add("wrong");
        btn.disabled = true;
      }
    },

    restart() { this.start(); },
  };
</script>
</body>
</html>
