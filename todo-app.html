<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#5b6cff" />
  <title>Projects · To-Do</title>
  <style>
    :root {
      --bg: #f4f5fb;
      --surface: #ffffff;
      --text: #181a2b;
      --muted: #8b8fa8;
      --line: #eef0f6;
      --accent: #5b6cff;
      --accent-2: #7c8cff;
      --accent-soft: #eef0ff;
      --danger: #ef4444;
      --danger-soft: #fee2e2;
      --shadow-sm: 0 1px 2px rgba(20,22,40,.05);
      --shadow: 0 10px 30px rgba(20,22,40,.08);
      --radius: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #eef0fb 0%, var(--bg) 30%);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 16px 64px;
    }

    /* Header */
    header { margin: 6px 4px 18px; display: flex; align-items: flex-end; justify-content: space-between; }
    header h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    header .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    header .progress-pill {
      font-size: 12px; color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 12px; border-radius: 999px; font-weight: 600;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 14px;
    }

    /* Calendar */
    .cal-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .cal-title { font-weight: 700; font-size: 16px; }
    .cal-nav { display: inline-flex; gap: 6px; }
    .cal-nav button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      width: 34px; height: 34px;
      border-radius: 10px;
      font-size: 16px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, transform .1s;
    }
    .cal-nav button:hover { background: var(--accent-soft); color: var(--accent); }
    .cal-nav button:active { transform: scale(.95); }
    .cal-nav .today-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block;
    }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-dow { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 0; font-weight: 700; letter-spacing: .02em; }
    .cal-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 500;
      border-radius: 10px; cursor: pointer;
      transition: background .15s, color .15s;
      user-select: none;
    }
    .cal-cell.empty { cursor: default; }
    .cal-cell.muted { color: #c5c8d6; }
    .cal-cell .dot {
      position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
    }
    .cal-cell.today { color: var(--accent); font-weight: 800; }
    .cal-cell.has-open { color: var(--danger); font-weight: 700; }
    .cal-cell.has-open .dot { background: var(--danger); }
    .cal-cell.selected { background: var(--accent); color: #fff; font-weight: 700; box-shadow: 0 4px 12px rgba(91,108,255,.35); }
    .cal-cell.selected .dot { background: #fff; }
    .cal-cell:hover:not(.empty):not(.selected) { background: var(--accent-soft); }

    /* Add form */
    .date-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 12px; border-radius: 999px; font-weight: 600;
      margin-bottom: 12px;
    }
    .add-row { display: flex; gap: 8px; align-items: stretch; }
    .add-row input[type="text"] {
      flex: 1; border: 1.5px solid var(--line);
      background: #fff; color: var(--text);
      border-radius: var(--radius-sm);
      padding: 13px 16px; font-size: 15px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .add-row input[type="text"]::placeholder { color: #b0b3c4; }
    .add-row input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .add-row button {
      border: none; background: var(--accent); color: #fff;
      border-radius: var(--radius-sm);
      padding: 0 20px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: transform .1s, background .15s, box-shadow .15s;
      box-shadow: 0 4px 12px rgba(91,108,255,.3);
    }
    .add-row button:hover { background: var(--accent-2); }
    .add-row button:active { transform: scale(.96); }

    /* Emoji picker */
    .emoji-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 12px;
    }
    .emoji-btn {
      width: 38px; height: 38px;
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 10px;
      font-size: 19px; line-height: 1;
      cursor: pointer; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s, transform .1s, box-shadow .15s;
    }
    .emoji-btn:hover { background: var(--accent-soft); }
    .emoji-btn:active { transform: scale(.92); }
    .emoji-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 3px rgba(91,108,255,.15);
    }
    .task-emoji {
      font-size: 20px; line-height: 1;
      flex: 0 0 auto;
      margin-top: 1px;
    }

    /* List */
    .list { list-style: none; margin: 0; padding: 0; }
    .group-label {
      font-size: 11px; color: var(--muted); font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      margin: 14px 4px 4px;
    }
    .group-label:first-child { margin-top: 0; }
    .list li {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 6px;
      border-bottom: 1px solid var(--line);
      animation: slideIn .18s ease;
    }
    .list li:last-child { border-bottom: none; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    .check {
      width: 22px; height: 22px; flex: 0 0 auto;
      border: 2px solid #d4d7e5; border-radius: 7px;
      cursor: pointer; background: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s;
      margin-top: 1px;
    }
    .check::after {
      content: ""; width: 10px; height: 6px;
      border-left: 2px solid #fff; border-bottom: 2px solid #fff;
      transform: rotate(-45deg) scale(0); transition: transform .12s ease;
      margin-top: -2px;
    }
    .list li.done .check { background: var(--accent); border-color: var(--accent); }
    .list li.done .check::after { transform: rotate(-45deg) scale(1); }

    .task-main { flex: 1; min-width: 0; }
    .task-text { font-size: 15px; word-break: break-word; cursor: pointer; }
    .list li.done .task-text { text-decoration: line-through; color: var(--muted); }
    .task-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .delete {
      border: none; background: transparent; color: var(--muted);
      font-size: 16px; width: 32px; height: 32px;
      border-radius: 8px; cursor: pointer; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
      margin-top: -3px;
    }
    .delete:hover { background: var(--danger-soft); color: var(--danger); }

    .empty-state {
      text-align: center; padding: 28px 8px;
      color: var(--muted); font-size: 14px;
    }
    .empty-state .emoji { font-size: 32px; display: block; margin-bottom: 8px; opacity: .6; }

    /* Confetti */
    .confetti-layer {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      border-radius: 2px;
      will-change: transform, opacity;
      transform: translate(-50%, -50%) rotate(0);
    }

    @media (max-width: 380px) {
      header h1 { font-size: 24px; }
      .cal-cell { font-size: 13px; }
      .add-row button { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Projects</h1>
        <div class="sub" id="subCount">No tasks</div>
      </div>
      <div class="progress-pill" id="progressPill" hidden>0%</div>
    </header>

    <section class="card">
      <div class="cal-head">
        <div class="cal-title" id="calTitle">Month</div>
        <div class="cal-nav">
          <button id="prevMonth" aria-label="Previous month">‹</button>
          <button id="todayBtn" aria-label="Today"><span class="today-dot"></span></button>
          <button id="nextMonth" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </section>

    <section class="card">
      <div class="date-pill" id="datePill">No date selected</div>
      <div class="emoji-row" id="emojiRow" role="radiogroup" aria-label="Pick an emoji"></div>
      <div class="add-row">
        <input id="taskInput" type="text" placeholder="Enter a task…" maxlength="200" />
        <button id="addBtn">Add</button>
      </div>
    </section>

    <section class="card">
      <ul class="list" id="list"></ul>
      <div class="empty-state" id="emptyState" hidden>
        <span class="emoji">✓</span>
        No tasks yet. Pick a date and add one.
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      "use strict";

      var SUPABASE_URL = "https://whcynnrhxwvfvjzmwplg.supabase.co";
      var SUPABASE_KEY = "sb_publishable_yHPWa7ovy4ECFELsqk-tQw_-pkSbuA7";
      var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      var TABLE = "todos";

      var EMOJIS = ["📑", "✍️", "🧪", "☕", "🏃", "🎼"];
      var DEFAULT_EMOJI = "📑";
      var tasks = [];
      var viewYear, viewMonth;
      var selectedDate = todayISO();
      var selectedEmoji = DEFAULT_EMOJI;

      // ---------- Storage (Supabase) ----------
      function sanitizeEmoji(em) {
        return (!em || EMOJIS.indexOf(em) === -1) ? DEFAULT_EMOJI : em;
      }
      function rowToTask(row) {
        var ts = row.created_at ? new Date(row.created_at).getTime() : Date.now();
        return {
          id: row.id != null ? Number(row.id) : null,
          text: row.task,
          date: row.date,
          emoji: sanitizeEmoji(row.emoji),
          done: !!row.is_complete,
          created: ts,
          rawCreatedAt: row.created_at
        };
      }

      async function loadTasks() {
        try {
          var res = await supabase.from(TABLE).select("*").order("created_at", { ascending: true });
          if (res.error) throw res.error;
          tasks = (res.data || []).map(rowToTask);
        } catch (e) {
          console.error("Failed to load tasks from Supabase:", e);
          tasks = [];
        }
      }
      async function insertTask(text, date, emoji) {
        var res = await supabase
          .from(TABLE)
          .insert([{ task: text, date: date, emoji: emoji, is_complete: false }])
          .select();
        if (res.error) throw res.error;
        return res.data && res.data.length ? rowToTask(res.data[0]) : null;
      }
      async function updateDone(task, done) {
        var col = task.id != null ? "id" : "created_at";
        var val = task.id != null ? task.id : task.rawCreatedAt;
        var res = await supabase.from(TABLE).update({ is_complete: done }).eq(col, val);
        if (res.error) throw res.error;
      }
      async function deleteRow(task) {
        var col = task.id != null ? "id" : "created_at";
        var val = task.id != null ? task.id : task.rawCreatedAt;
        var res = await supabase.from(TABLE).delete().eq(col, val);
        if (res.error) throw res.error;
      }

      // ---------- Date helpers ----------
      function pad(n) { return n < 10 ? "0" + n : "" + n; }
      function isoOf(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }
      function todayISO() {
        var d = new Date();
        return isoOf(d.getFullYear(), d.getMonth(), d.getDate());
      }
      function fmtDate(iso) {
        var d = new Date(iso + "T00:00:00");
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }
      function fmtFull(iso) {
        var d = new Date(iso + "T00:00:00");
        return d.toLocaleDateString(undefined, { weekday: "short", month: "long", day: "numeric", year: "numeric" });
      }
      function isSameDay(iso1, iso2) {
        return iso1 === iso2;
      }

      // ---------- Elements ----------
      var calGrid = document.getElementById("calGrid");
      var calTitle = document.getElementById("calTitle");
      var datePill = document.getElementById("datePill");
      var taskInput = document.getElementById("taskInput");
      var addBtn = document.getElementById("addBtn");
      var listEl = document.getElementById("list");
      var emptyState = document.getElementById("emptyState");
      var subCount = document.getElementById("subCount");
      var progressPill = document.getElementById("progressPill");
      var emojiRow = document.getElementById("emojiRow");

      // ---------- Emoji picker ----------
      function renderEmojiPicker() {
        emojiRow.innerHTML = "";
        EMOJIS.forEach(function (em) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "emoji-btn" + (em === selectedEmoji ? " active" : "");
          btn.textContent = em;
          btn.setAttribute("role", "radio");
          btn.setAttribute("aria-checked", em === selectedEmoji ? "true" : "false");
          btn.setAttribute("aria-label", em);
          btn.addEventListener("click", function () {
            selectedEmoji = em;
            renderEmojiPicker();
            taskInput.focus();
          });
          emojiRow.appendChild(btn);
        });
      }

      // ---------- Calendar ----------
      function renderCalendar() {
        calTitle.textContent = new Date(viewYear, viewMonth, 1)
          .toLocaleDateString(undefined, { month: "long", year: "numeric" });

        var startDow = new Date(viewYear, viewMonth, 1).getDay();
        var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        var daysPrev = new Date(viewYear, viewMonth, 0).getDate();

        var today = todayISO();
        var hasAny = {};
        var hasOpen = {};
        for (var i = 0; i < tasks.length; i++) {
          var td = tasks[i].date;
          hasAny[td] = true;
          if (!tasks[i].done) hasOpen[td] = true;
        }

        var html = "";
        var dows = ["S", "M", "T", "W", "T", "F", "S"];
        for (var i = 0; i < 7; i++) html += '<div class="cal-dow">' + dows[i] + '</div>';

        for (var i = startDow - 1; i >= 0; i--) {
          html += '<div class="cal-cell empty muted">' + (daysPrev - i) + '</div>';
        }
        for (var d = 1; d <= daysInMonth; d++) {
          var iso = isoOf(viewYear, viewMonth, d);
          var cls = "cal-cell";
          if (iso === today) cls += " today";
          if (hasOpen[iso]) cls += " has-open";
          if (iso === selectedDate) cls += " selected";
          html += '<div class="' + cls + '" data-date="' + iso + '">' + d +
                  (hasAny[iso] ? '<span class="dot"></span>' : '') + '</div>';
        }
        var trail = (7 - ((startDow + daysInMonth) % 7)) % 7;
        for (var j = 1; j <= trail; j++) {
          html += '<div class="cal-cell empty muted">' + j + '</div>';
        }

        calGrid.innerHTML = html;

        var cells = calGrid.querySelectorAll(".cal-cell:not(.empty)");
        Array.prototype.forEach.call(cells, function (cell) {
          cell.addEventListener("click", function () {
            selectedDate = cell.getAttribute("data-date");
            renderCalendar();
            renderForm();
            renderList();
            taskInput.focus();
          });
        });
      }

      function renderForm() {
        datePill.textContent = fmtFull(selectedDate);
      }

      // ---------- List ----------
      function renderList() {
        var sorted = tasks.slice().sort(function (a, b) {
          if (a.date !== b.date) return a.date < b.date ? -1 : 1;
          return a.created - b.created;
        });

        listEl.innerHTML = "";

        if (sorted.length === 0) {
          emptyState.hidden = false;
        } else {
          emptyState.hidden = true;
        }

        var lastDate = null;
        sorted.forEach(function (t) {
          if (t.date !== lastDate) {
            var lbl = document.createElement("div");
            lbl.className = "group-label";
            lbl.textContent = fmtDate(t.date);
            listEl.appendChild(lbl);
            lastDate = t.date;
          }
          var li = document.createElement("li");
          if (t.done) li.className = "done";
          li.innerHTML =
            '<span class="check" role="checkbox" aria-checked="' + (t.done ? "true" : "false") + '"></span>' +
            '<span class="task-emoji"></span>' +
            '<div class="task-main"><div class="task-text"></div>' +
            '<div class="task-meta">' + fmtDate(t.date) + '</div></div>' +
            '<button class="delete" aria-label="Delete">✕</button>';
          li.querySelector(".task-emoji").textContent = t.emoji || DEFAULT_EMOJI;
          li.querySelector(".task-text").textContent = t.text;

          (function (taskRef) {
            var checkEl = li.querySelector(".check");
            li.querySelector(".check").addEventListener("click", function () { toggleDone(taskRef, checkEl); });
            li.querySelector(".task-text").addEventListener("click", function () { toggleDone(taskRef, checkEl); });
            li.querySelector(".delete").addEventListener("click", function () { deleteTask(taskRef); });
          })(t);

          listEl.appendChild(li);
        });

        var total = tasks.length;
        var done = tasks.filter(function (t) { return t.done; }).length;
        var remaining = total - done;

        subCount.textContent = total === 0
          ? "No tasks"
          : (remaining + " of " + total + " remaining");

        if (total > 0) {
          var pct = Math.round((done / total) * 100);
          progressPill.textContent = pct + "%";
          progressPill.hidden = false;
        } else {
          progressPill.hidden = true;
        }
      }

      // ---------- Actions ----------
      async function addTask() {
        var text = taskInput.value.trim();
        if (!text) { taskInput.focus(); return; }
        addBtn.disabled = true;
        try {
          var task = await insertTask(text, selectedDate, selectedEmoji);
          if (task) tasks.push(task);
          taskInput.value = "";
          selectedEmoji = DEFAULT_EMOJI;
          renderEmojiPicker();
          renderCalendar();
          renderList();
        } catch (e) {
          console.error("Failed to add task:", e);
          alert("Could not save task. Check your connection and try again.");
        } finally {
          addBtn.disabled = false;
          taskInput.focus();
        }
      }
      async function toggleDone(taskRef, originEl) {
        var task = null;
        for (var i = 0; i < tasks.length; i++) {
          if (tasks[i].rawCreatedAt === taskRef.rawCreatedAt) { task = tasks[i]; break; }
        }
        if (!task) return;
        var becomingDone = !task.done;
        task.done = !task.done; // optimistic
        if (becomingDone && originEl) {
          var r = originEl.getBoundingClientRect();
          fireConfetti(r.left + r.width / 2, r.top + r.height / 2);
        }
        renderList();
        try {
          await updateDone(task, task.done);
        } catch (e) {
          console.error("Failed to update task:", e);
          task.done = !task.done; // revert
          renderList();
        }
      }

      // ---------- Confetti ----------
      function fireConfetti(x, y) {
        var layer = document.createElement("div");
        layer.className = "confetti-layer";
        document.body.appendChild(layer);

        var colors = ["#5b6cff", "#7c8cff", "#22c55e", "#f59e0b", "#ef4444", "#ec4899", "#06b6d4"];
        var count = 26;

        for (var i = 0; i < count; i++) {
          var piece = document.createElement("div");
          piece.className = "confetti-piece";
          var w = 5 + Math.random() * 6;
          piece.style.width = w + "px";
          piece.style.height = (w * (0.4 + Math.random() * 0.9)) + "px";
          piece.style.left = x + "px";
          piece.style.top = y + "px";
          piece.style.background = colors[i % colors.length];

          var angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
          var distance = 70 + Math.random() * 70;
          var tx = Math.cos(angle) * distance;
          var ty = Math.sin(angle) * distance - 30; // bias upward
          var rotate = (Math.random() - 0.5) * 720;

          piece.style.transition = "transform 800ms cubic-bezier(.15,.7,.35,1), opacity 800ms ease-out";
          layer.appendChild(piece);

          // force reflow, then animate
          piece.offsetWidth;
          piece.style.transform =
            "translate(calc(-50% + " + tx + "px), calc(-50% + " + ty + "px)) rotate(" + rotate + "deg)";
          piece.style.opacity = "0";
        }

        setTimeout(function () { if (layer.parentNode) layer.remove(); }, 900);
      }
      async function deleteTask(taskRef) {
        var removed = tasks.filter(function (t) { return t.rawCreatedAt === taskRef.rawCreatedAt; });
        tasks = tasks.filter(function (t) { return t.rawCreatedAt !== taskRef.rawCreatedAt; }); // optimistic
        renderCalendar();
        renderList();
        try {
          await deleteRow(taskRef);
        } catch (e) {
          console.error("Failed to delete task:", e);
          tasks = tasks.concat(removed); // restore on failure
          renderCalendar();
          renderList();
        }
      }

      // ---------- Wire up ----------
      addBtn.addEventListener("click", addTask);
      taskInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") addTask();
      });
      document.getElementById("prevMonth").addEventListener("click", function () {
        viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        renderCalendar();
      });
      document.getElementById("nextMonth").addEventListener("click", function () {
        viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        renderCalendar();
      });
      document.getElementById("todayBtn").addEventListener("click", function () {
        var d = new Date();
        viewYear = d.getFullYear(); viewMonth = d.getMonth();
        selectedDate = todayISO();
        renderCalendar(); renderForm(); renderList();
      });

      // ---------- Init ----------
      (async function init() {
        var d = new Date();
